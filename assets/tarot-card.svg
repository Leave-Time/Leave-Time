<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Creator tarot card placeholder</title>
  <desc id="desc">A dark celestial tarot card with a central moon and stars.</desc>
  <defs>
