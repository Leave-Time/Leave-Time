<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .preview {
    --bg: #fff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --rule: #d1d9e0b3;
    --link: #0969da; --code: #818b981f;
    color-scheme: light; min-height: 100vh; background: var(--bg); color: var(--fg); padding: 24px 16px;
  }
  .preview:has(#dark:checked) {
    --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --rule: #3d444db3;
    --link: #4493f8; --code: #656c7633; color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    .preview:has(#system:checked) {
      --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --rule: #3d444db3;
      --link: #4493f8; --code: #656c7633; color-scheme: dark;
    }
  }
  .wrap { max-width: 896px; margin: auto; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; color: var(--muted); font-size: 14px; }
  .themes { display: flex; gap: 6px; border: 0; padding: 0; margin: 0; }
  .themes label { display: inline-flex; align-items: center; padding: 4px; cursor: pointer; }
  .themes input { margin: 0 4px 0 0; accent-color: var(--link); }
  .markdown-body { display: flow-root; border: 1px solid var(--border); border-radius: 6px; padding: 32px; overflow-wrap: break-word; }
  .markdown-body h1, .markdown-body h3 { margin: 24px 0 16px; font-weight: 600; line-height: 1.25; }
  .markdown-body h1 { margin-top: 0; font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body p, .markdown-body blockquote { margin: 0 0 16px; }
  .markdown-body blockquote { padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
  .markdown-body blockquote p:last-child { margin-bottom: 0; }
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body code { font: 85% ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; white-space: break-spaces; padding: .2em .4em; background: var(--code); border-radius: 6px; }
  .markdown-body img { max-width: 100%; }
  @media (max-width: 540px) {
    .preview { padding: 12px; }
    .markdown-body { padding: 16px; }
  }
</style>
